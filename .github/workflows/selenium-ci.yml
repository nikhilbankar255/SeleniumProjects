
name: Selenium Automation CI

# Workflow triggers
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# GitHub runner permissions
permissions:
  contents: read

jobs:
  selenium-test:

    # Operating system
    runs-on: ubuntu-latest

    # Maximum execution time
    timeout-minutes: 30

    steps:

      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v6

      # 2. Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Verify Java and Maven
      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      # 4. Execute Selenium TestNG tests
      - name: Run Selenium Tests
        run: mvn -B clean test

      # 5. Upload Extent Reports and TestNG results
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Test-Reports
          path: |
            Reports/
            test-output/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
